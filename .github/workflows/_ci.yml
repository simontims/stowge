name: Continuous Integration

on:
  workflow_call:

permissions:
  contents: read


jobs:
  api-docs-sync:
    name: API Docs Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Regenerate API docs
        run: python scripts/generate_api_docs.py

      - name: Verify docs are up to date
        run: |
          if [ -n "$(git status --porcelain -- docs/api/openapi.json docs/api/endpoints.md)" ]; then
            echo "Generated API docs are out of date."
            echo "Run: python scripts/generate_api_docs.py"
            echo "Then commit docs/api/openapi.json and docs/api/endpoints.md"
            git --no-pager diff -- docs/api/openapi.json docs/api/endpoints.md || true
            exit 1
          fi

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: astral-sh/ruff-action@v3
        with:
          src: ${{ github.workspace }}/api
          args: check --config ${{ github.workspace }}/api/ruff.toml

  lint-typescript:
    name: Lint (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ./ui/.nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run lint
        run: npm run lint

  test-python:
    name: Test (Python)
    needs: lint-python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: |
          pytest tests

  test-typescript:
    name: Test (TypeScript)
    needs: lint-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ./ui/.nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
